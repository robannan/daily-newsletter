name: Daily newsletter

on:
  schedule:
    # runs at 10:00 UTC every day — change this to match the local time you want (GitHub Actions uses UTC).
    - cron: '0 10 * * *'
  workflow_dispatch: {}  # lets you run manually from Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run newsletter script
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          MAX_PER_FEED: '5'
        run: python main.py

      - name: Commit updated sent_articles.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_articles.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update sent_articles.json: $(date -u +'%Y-%m-%d %H:%M')"
            git push origin HEAD:main
          fi
